# Standalone, isolated monitoring project. Linux host networking is intentional:
# native exporters and all web listeners can stay on 127.0.0.1.
name: sentinel-operations
services:
  prometheus:
    image: prom/prometheus:v2.54.1
    network_mode: host
    command: ['--config.file=/etc/prometheus/prometheus.yml', '--web.listen-address=127.0.0.1:9090', '--storage.tsdb.retention.time=14d']
    volumes:
      - ./monitoring/prometheus-operations.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-ops-data:/prometheus
    mem_limit: 768m
    restart: unless-stopped
  alertmanager:
    image: prom/alertmanager:v0.27.0
    network_mode: host
    command: ['--config.file=/etc/alertmanager/alertmanager.yml', '--web.listen-address=127.0.0.1:9093', '--cluster.listen-address=']
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-ops-data:/alertmanager
    mem_limit: 128m
    restart: unless-stopped
  grafana:
    image: grafana/grafana:11.2.0
    network_mode: host
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: '3000'
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in a private environment}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
    configs:
      - source: grafana-datasource
        target: /etc/grafana/provisioning/datasources/sentinel.yml
      - source: grafana-provider
        target: /etc/grafana/provisioning/dashboards/sentinel.yml
    volumes:
      - ./monitoring/grafana/operations.json:/var/lib/grafana/dashboards/operations.json:ro
      - grafana-ops-data:/var/lib/grafana
    mem_limit: 384m
    restart: unless-stopped
configs:
  grafana-datasource:
    content: |
      apiVersion: 1
      datasources:
        - name: Sentinel Operations
          uid: sentinel-operations
          type: prometheus
          access: proxy
          url: http://127.0.0.1:9090
          isDefault: true
          editable: false
  grafana-provider:
    content: |
      apiVersion: 1
      providers:
        - name: operations
          type: file
          options:
            path: /var/lib/grafana/dashboards
volumes:
  prometheus-ops-data:
  alertmanager-ops-data:
  grafana-ops-data:
