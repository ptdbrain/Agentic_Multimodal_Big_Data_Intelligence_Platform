[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: Unit tests verifying isolated component logic without external service dependencies",
    "spark: Tests requiring a working Spark JVM",
    "airflow: Requires the real Airflow scheduler and executor",
    "live: Tests requiring a public network source",
    "integration: End-to-end and external infrastructure integration tests",
]

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [
    ".git",
    "__pycache__",
    ".pytest_cache",
    ".ruff_cache",
    "storage",
    "spark-warehouse",
]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
ignore = []
