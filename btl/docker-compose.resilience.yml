# Deliberately standalone: no serving data or volumes are shared with the app.
name: sentinel-resilience-drill
x-kafka: &kafka
  image: apache/kafka:3.7.0
  labels: {sentinel.drill: 'true'}
  mem_limit: 1g
  environment: &kafka-env
    KAFKA_PROCESS_ROLES: broker,controller
    KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:9093,2@kafka2:9093,3@kafka3:9093
    KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
    KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
    KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
    KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '3'
    KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: '3'
    KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: '2'
    KAFKA_DEFAULT_REPLICATION_FACTOR: '3'
    KAFKA_MIN_INSYNC_REPLICAS: '2'
    KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
    KAFKA_LOG_DIRS: /var/lib/kafka/data
    KAFKA_LOG_RETENTION_HOURS: '168'
    KAFKA_HEAP_OPTS: '-Xms384m -Xmx512m'
    CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
services:
  kafka1:
    <<: *kafka
    hostname: kafka1
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: '1'
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:39094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka1:9092,EXTERNAL://127.0.0.1:39094
    ports: ['127.0.0.1:39094:39094']
    volumes: [kafka1-drill:/var/lib/kafka/data]
  kafka2:
    <<: *kafka
    hostname: kafka2
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: '2'
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:39095
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka2:9092,EXTERNAL://127.0.0.1:39095
    ports: ['127.0.0.1:39095:39095']
    volumes: [kafka2-drill:/var/lib/kafka/data]
  kafka3:
    <<: *kafka
    hostname: kafka3
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: '3'
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:39096
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka3:9092,EXTERNAL://127.0.0.1:39096
    ports: ['127.0.0.1:39096:39096']
    volumes: [kafka3-drill:/var/lib/kafka/data]
  spark-master:
    image: ${SPARK_DRILL_IMAGE:-apache/spark:3.5.0}
    labels: {sentinel.drill: 'true'}
    hostname: spark-master
    command: ['/opt/spark/bin/spark-class', 'org.apache.spark.deploy.master.Master', '--host', 'spark-master']
    mem_limit: 2g
    ports: ['127.0.0.1:37077:7077', '127.0.0.1:38080:8080']
    volumes: ['./scripts/verify_operations_stack.py:/opt/sentinel/verify_operations_stack.py:ro', 'spark-drill:/tmp/sentinel-drill']
  spark-worker1:
    image: ${SPARK_DRILL_IMAGE:-apache/spark:3.5.0}
    labels: {sentinel.drill: 'true'}
    command: ['/opt/spark/bin/spark-class', 'org.apache.spark.deploy.worker.Worker', '--cores', '2', '--memory', '2g', 'spark://spark-master:7077']
    mem_limit: 3g
    depends_on: [spark-master]
    volumes: [spark-drill:/tmp/sentinel-drill]
  spark-worker2:
    image: ${SPARK_DRILL_IMAGE:-apache/spark:3.5.0}
    labels: {sentinel.drill: 'true'}
    command: ['/opt/spark/bin/spark-class', 'org.apache.spark.deploy.worker.Worker', '--cores', '2', '--memory', '2g', 'spark://spark-master:7077']
    mem_limit: 3g
    depends_on: [spark-master]
    volumes: [spark-drill:/tmp/sentinel-drill]
volumes:
  kafka1-drill:
  kafka2-drill:
  kafka3-drill:
  spark-drill:
