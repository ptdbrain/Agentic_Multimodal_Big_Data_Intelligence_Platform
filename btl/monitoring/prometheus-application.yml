global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
- /etc/prometheus/alerts.yml
alerting:
  alertmanagers:
  - static_configs:
    - targets:
      - alertmanager:9093
scrape_configs:
- job_name: sentinel-metrics
  static_configs:
  - targets:
    - metrics:8000
- job_name: sentinel-dependencies
  static_configs:
  - targets:
    - dependencies:8001
- job_name: sentinel-operations
  static_configs:
  - targets:
    - operations:8002
