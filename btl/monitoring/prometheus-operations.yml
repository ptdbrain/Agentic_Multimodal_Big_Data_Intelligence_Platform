# Linux host networking: every HTTP listener remains bound to loopback.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: [/etc/prometheus/alerts.yml]
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['127.0.0.1:9093']
scrape_configs:
  - job_name: sentinel-platform
    static_configs:
      - targets: ['127.0.0.1:8000']
  - job_name: sentinel-dependencies
    scrape_interval: 30s
    scrape_timeout: 20s
    static_configs:
      - targets: ['127.0.0.1:8001']
  - job_name: sentinel-operations
    static_configs:
      - targets: ['127.0.0.1:8002']
