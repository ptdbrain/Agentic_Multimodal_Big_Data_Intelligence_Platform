groups:
- name: sentinel-operations
  rules:
  - alert: SentinelExporterUnavailable
    expr: up{job=~"sentinel-.*"} == 0
    for: 2m
    labels:
      severity: critical
    annotations:
      summary: Metrics collection unavailable
      runbook: docs/operations-monitoring.md#exporter
  - alert: SentinelPipelineFailed
    expr: sentinel_ops_run_state{state="failed"} == 1
    labels:
      severity: critical
    annotations:
      summary: Pipeline failed
      runbook: docs/operations-monitoring.md#pipeline
  - alert: SentinelPipelineStale
    expr: time() - sentinel_ops_last_success_timestamp{pipeline=~"commerce|articles"}
      > 93600
    labels:
      severity: warning
    annotations:
      summary: Daily pipeline has no success within 26 hours
      runbook: docs/operations-monitoring.md#pipeline
  - alert: SentinelPipelineNeverSucceeded
    expr: (time() - sentinel_ops_expected_since_timestamp{pipeline=~"commerce|articles"}
      > 93600) and (sentinel_ops_last_success_timestamp != sentinel_ops_last_success_timestamp)
    labels:
      severity: warning
    annotations:
      summary: Registered pipeline has never succeeded
      runbook: docs/operations-monitoring.md#pipeline
  - alert: SentinelInputShortage
    expr: (sentinel_ops_received < sentinel_ops_expected_min) and on(pipeline, source)
      (sentinel_ops_run_state{state="success"} == 1)
    labels:
      severity: warning
    annotations:
      summary: Input below configured expectation
      runbook: docs/operations-monitoring.md#pipeline
  - alert: SentinelKafkaBacklog
    expr: sentinel_ops_consumer_lag > 1000
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: Consumer lag exceeds 1000 messages
      runbook: docs/operations-monitoring.md#kafka
  - alert: SentinelKafkaUnderReplicated
    expr: sentinel_ops_under_replicated_partitions > 0
    for: 2m
    labels:
      severity: critical
    annotations:
      summary: Kafka partitions lack replicas
      runbook: docs/operations-monitoring.md#kafka
  - alert: SentinelBackupStale
    expr: time() - sentinel_ops_backup_last_complete_timestamp > 93600
    labels:
      severity: critical
    annotations:
      summary: No complete backup within 26 hours
      runbook: docs/operations-monitoring.md#backup
  - alert: SentinelBackupNeverObserved
    expr: sentinel_ops_backup_last_complete_timestamp != sentinel_ops_backup_last_complete_timestamp
    for: 26h
    labels:
      severity: warning
    annotations:
      summary: No verified backup has been observed
      runbook: docs/operations-monitoring.md#backup
  - alert: SentinelDiskLow
    expr: sentinel_ops_disk_free_ratio < 0.15
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: Configured filesystem has less than 15 percent free
      runbook: docs/operations-monitoring.md#storage
  - alert: SentinelCheckpointFailure
    expr: sentinel_ops_checkpoint_errors > 0
    labels:
      severity: critical
    annotations:
      summary: Checkpoint operation failed
      runbook: docs/operations-monitoring.md#checkpoint
  - alert: SentinelOperationsMeasurementStale
    expr: time() - {__name__=~"sentinel_ops_(consumer_lag|under_replicated_partitions|disk_free_ratio)_observed_timestamp"}
      > 120
    for: 2m
    labels:
      severity: warning
    annotations:
      summary: Operational probe measurement is stale
      runbook: docs/operations-monitoring.md#exporter
  - alert: SentinelStreamStalled
    expr: |
      (time() - sentinel_ops_expected_since_timestamp{pipeline="streaming"} > 120)
      unless on(job, instance, pipeline, source)
      (time() - sentinel_ops_stream_heartbeat_timestamp <= 120)
    for: 2m
    labels:
      severity: critical
    annotations:
      summary: Enabled stream has no recent trigger heartbeat from every sink
      runbook: docs/operations-monitoring.md#streaming
  - alert: SentinelStreamNoData
    expr: (time() - sentinel_ops_stream_progress_timestamp > 900) and on(pipeline,source)
      sentinel_ops_expected_since_timestamp
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: Enabled continuous stream has processed no new input for 15 minutes
      runbook: docs/operations-monitoring.md#streaming
  - alert: SentinelSourceFailed
    expr: sentinel_source_state{state="failed"} == 1
    labels:
      severity: critical
    annotations:
      summary: Managed source capture or processing failed
      runbook: docs/operations-monitoring.md#sources
  - alert: SentinelSourcePartial
    expr: sentinel_source_state{state="partial"} == 1
    labels:
      severity: warning
    annotations:
      summary: Managed source has incomplete collection coverage
      runbook: docs/operations-monitoring.md#sources
  - alert: SentinelSourceStale
    expr: time() - sentinel_source_last_capture_timestamp > 93600
    labels:
      severity: warning
    annotations:
      summary: Managed source has no new capture within 26 hours
      runbook: docs/operations-monitoring.md#sources
  - alert: SentinelSourceNeverCaptured
    expr: (time() - sentinel_source_expected_since_timestamp > 93600) and (sentinel_source_last_capture_timestamp
      != sentinel_source_last_capture_timestamp)
    labels:
      severity: warning
    annotations:
      summary: Managed source has never produced a durable capture
      runbook: docs/operations-monitoring.md#sources
  - alert: SentinelSourceInputShortage
    expr: (sentinel_source_input_records < sentinel_source_expected_min) and on(source_job,source)
      (sentinel_source_state{state=~"complete|partial"} == 1)
    labels:
      severity: warning
    annotations:
      summary: Managed source input is below its configured minimum
      runbook: docs/operations-monitoring.md#sources
  - alert: SentinelStreamFailed
    expr: sentinel_ops_stream_errors > 0
    labels:
      severity: critical
    annotations:
      summary: Spark stream query failed and has no committed recovery
      runbook: docs/operations-monitoring.md#streaming
